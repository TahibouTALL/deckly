<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deckly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236C4CF5'/%3E%3Cstop offset='1' stop-color='%23FF6B8B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='8' y='9' width='16' height='11' rx='2.5' fill='white'/%3E%3Crect x='11' y='22' width='10' height='2.5' rx='1.25' fill='white' opacity='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- HOME -->
<section id="home" class="home">
  <header class="home-top">
    <div class="brand"><span class="brand-mark"></span>Deckly</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn ghost lang-btn" title="Language"><i data-ic="languages"></i>Language</button>
      <button class="btn ghost desktop-only hidden" id="homeUpdates"><i data-ic="refresh-cw"></i>Updates</button>
      <div class="net-pill" id="netPillHome"></div>
    </div>
  </header>
  <div class="home-hero">
    <h1>What will you present today?</h1>
    <p>Pick a size to start from scratch, or open a ready-made template.</p>
    <div class="size-cards" id="sizeCards"></div>
  </div>
  <div class="home-section">
    <h2>Start from a template</h2>
    <div class="tpl-grid" id="homeTemplates"></div>
  </div>
  <div class="home-section">
    <div class="row-between"><h2>Your designs</h2>
      <button class="btn ghost" id="openFileHome"><i data-ic="folder-open"></i>Open a .deckly file</button></div>
    <div class="recent-grid" id="recentGrid"></div>
  </div>
</section>

<!-- EDITOR -->
<section id="editor" class="editor hidden">
  <header class="topbar">
    <button class="tb-btn" id="homeBtn" title="Home"><span class="brand-mark sm"></span></button>
    <div class="menu-wrap">
      <button class="tb-btn text" id="fileMenuBtn">File <i data-ic="chevron-down"></i></button>
      <div class="menu" id="fileMenu">
        <button data-act="new"><i data-ic="file-plus"></i>New design</button>
        <button data-act="open"><i data-ic="folder-open"></i>Open file…</button>
        <button data-act="save"><i data-ic="save"></i>Save as file (.deckly)</button>
        <button data-act="resize"><i data-ic="scaling"></i>Magic resize…</button>
        <button data-act="versions"><i data-ic="history"></i>Version history…</button>
        <hr>
        <button data-act="png"><i data-ic="image"></i>Download this slide (PNG)</button>
        <button data-act="pngt"><i data-ic="image-off"></i>PNG with transparent background</button>
        <button data-act="pdf"><i data-ic="file-text"></i>Download all slides (PDF)</button>
        <button data-act="pptx"><i data-ic="presentation"></i>Download PowerPoint (.pptx)</button>
        <hr>
        <button data-act="language"><i data-ic="languages"></i>Language</button>
        <hr class="desktop-only hidden">
        <button data-act="check-updates" class="desktop-only hidden"><i data-ic="refresh-cw"></i>Check for updates</button>
        <button data-act="update-settings" class="desktop-only hidden"><i data-ic="settings"></i>Update settings…</button>
      </div>
    </div>
    <button class="tb-btn" id="undoBtn" title="Undo (Ctrl+Z)"><i data-ic="undo-2"></i></button>
    <button class="tb-btn" id="redoBtn" title="Redo (Ctrl+Y)"><i data-ic="redo-2"></i></button>
    <span class="save-state" id="saveState"><i data-ic="cloud-check"></i>Saved</span>
    <div class="tb-spacer"></div>
    <input class="title-input" id="titleInput" spellcheck="false">
    <div class="tb-spacer"></div>
    <div class="net-pill" id="netPill"></div>
    <button class="btn ghost-light" id="downloadBtn"><i data-ic="download"></i>Download</button>
    <button class="btn primary" id="presentBtn"><i data-ic="play"></i>Present</button>
  </header>

  <div class="workspace">
    <nav class="rail" id="rail"></nav>
    <aside class="panel" id="panel">
      <div class="panel-head">
        <div class="search"><i data-ic="search"></i><input id="panelSearch" placeholder="Search"><button class="x" id="searchClear"><i data-ic="x"></i></button></div>
      </div>
      <div class="panel-body" id="panelBody"></div>
      <button class="panel-collapse" id="panelCollapse" title="Hide panel"><i data-ic="chevron-left"></i></button>
    </aside>

    <main class="stage-area">
      <div class="ctx-bar" id="ctxBar"></div>
      <div class="viewport" id="viewport">
        <div class="stage-wrap" id="stageWrap">
          <div class="stage" id="stage"></div>
          <div class="overlay" id="overlay"></div>
        </div>
        <div class="marquee hidden" id="marquee"></div>
      </div>
      <footer class="bottombar">
        <div class="slides-strip" id="slidesStrip"></div>
        <div class="zoom">
          <button class="tb-btn sm" id="zoomOut"><i data-ic="minus"></i></button>
          <button class="zoom-val" id="zoomVal">Fit</button>
          <button class="tb-btn sm" id="zoomIn"><i data-ic="plus"></i></button>
          <button class="tb-btn sm" id="helpBtn" title="Shortcuts"><i data-ic="keyboard"></i></button>
        </div>
      </footer>
    </main>
  </div>
</section>

<!-- PRESENT -->
<div id="present" class="present hidden">
  <div class="present-stage" id="presentStage"></div>
  <div class="present-hud"><button id="pPrev"><i data-ic="chevron-left"></i></button><span id="pCount"></span><button id="pNext"><i data-ic="chevron-right"></i></button><button id="pExit"><i data-ic="x"></i></button></div>
</div>

<div class="popover hidden" id="popover"></div>
<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
<input type="file" id="fileOpen" accept=".deckly,application/json" hidden>
<input type="file" id="fileUpload" accept="image/*" multiple hidden>

<script src="vendor/html-to-image.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pptxgen.bundle.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
